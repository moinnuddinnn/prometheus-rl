name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: prometheus-rl --version
  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,neural]'
      - run: python -c "import torch; print(torch.__version__)"
      - run: python -m pytest -q
      - run: prometheus-rl network-demo
      - run: prometheus-rl replay-demo
      - run: prometheus-rl dqn-demo
      - run: prometheus-rl variants-demo
      - run: prometheus-rl per-demo
  cartpole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,rl]'
      - run: python -c "import gymnasium, matplotlib; print(gymnasium.__version__)"
      - run: python -m pytest -q tests/test_cartpole.py tests/test_games.py tests/test_ppo.py
      - run: prometheus-rl cartpole train --steps 1200 --eval-episodes 3 --output runs/ci-smoke
      - run: prometheus-rl cartpole evaluate runs/ci-smoke/model.pt --episodes 3
      - run: >-
          prometheus-rl cartpole train --double --dueling --prioritized
          --steps 1200 --eval-episodes 3 --output runs/ci-per --no-plots
      - run: prometheus-rl snake train --steps 1200 --eval-episodes 3 --output runs/ci-snake --no-plots
      - run: prometheus-rl gridworld train --steps 1200 --eval-episodes 3 --output runs/ci-grid --no-plots
      - run: prometheus-rl snake evaluate runs/ci-snake/model.pt --episodes 3
      - run: prometheus-rl gridworld evaluate runs/ci-grid/model.pt --episodes 3
      - run: >-
          prometheus-rl ppo train --game cartpole --steps 128 --horizon 64
          --eval-episodes 1 --output runs/ci-ppo
      - run: prometheus-rl ppo evaluate runs/ci-ppo/model.pt --episodes 1
      - run: >-
          prometheus-rl ppo train --game pendulum --steps 128 --horizon 64
          --eval-episodes 1 --output runs/ci-pendulum
      - uses: actions/upload-artifact@v4
        with:
          name: cartpole-smoke
          path: runs/ci-smoke/
  atari:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'torch>=2.5,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,atari]'
      - run: python -c "import ale_py, gymnasium, cv2, numpy, torch"
      - run: python -m pytest -q tests/test_visual.py
      - run: >-
          prometheus-rl atari train --game breakout --steps 40 --capacity 64
          --warmup 16 --batch-size 4 --eval-episodes 1 --eval-max-steps 32
          --output runs/ci-atari
      - run: prometheus-rl atari evaluate runs/ci-atari/model.pt --episodes 1 --max-steps 32
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra
      - name: Build manuscript
        working-directory: docs/paper
        run: latexmk -pdf -halt-on-error -interaction=nonstopmode main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: mathematical-foundations
          path: docs/paper/main.pdf
