[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-rl"
version = "0.6.0"
description = "An incremental, research-oriented reinforcement learning framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
neural = ["torch>=2.5,<3"]
rl = ["numpy>=1.26,<3", "gymnasium[classic-control]>=1.0,<2", "torch>=2.5,<3"]

[project.scripts]
prometheus-rl = "prometheus_rl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
